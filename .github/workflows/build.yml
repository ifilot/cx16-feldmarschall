name: build

on:
  push:
    branches: [master, develop]
    tags: ['v*']
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cc65 python3 python3-numpy python3-pil unzip
      - name: Compile
        run: make
      - name: Check presets and rules
        run: make check
      - name: Rate the computer player
        # a short tournament: every engine plays every move legally to the end
        run: make rating ROUNDS=10
      - name: Package
        run: |
          make dist
          unzip -tq build/dist/FELDMARSCHALL.ZIP
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: FELDMARSCHALL.ZIP
          path: build/dist/FELDMARSCHALL.ZIP
          if-no-files-found: error

  emulator:
    # the game in the AgentBridge emulator: its tests, then docs/, which
    # make screenshots regenerates; warn when the commit's copy is stale
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cc65 python3 python3-numpy python3-pil
      - uses: ./.github/actions/agent-emulator
      - name: Emulator tests
        run: make test-endings test-flow test-variants test-colors test-sound test-controls test-demo test-panel test-menus test-dist
      - name: Regenerate screenshots
        run: make screenshots
      - name: Compare with docs/
        run: |
          stale=$(git status --porcelain -- docs | awk '{print $2}')
          if [ -n "$stale" ]; then
            echo "::warning title=Stale screenshots::Run make screenshots and commit: $(echo $stale)"
          fi
      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: docs/*.png

  release:
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: FELDMARSCHALL.ZIP
          path: build
      - name: Verify package
        run: |
          test -f build/FELDMARSCHALL.ZIP
          unzip -tq build/FELDMARSCHALL.ZIP
      - name: Publish package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/FELDMARSCHALL.ZIP --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/FELDMARSCHALL.ZIP \
              --verify-tag --title "Release $GITHUB_REF_NAME" --notes ""
          fi
