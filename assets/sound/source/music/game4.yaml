              | G5/8 G5 Bb5/4 Eb5/4. | C6/4 Bb5/4 A5/4. | A5/8 A5 F#5/4 D5/4. | F#5/4 E5/4 D5/4. |"
    horn1:   "| G4/2.+8 | A4/2.+8 | F4/2.+8 | G4/2.+8 | G4/2.+8 | A4/2.+8 | F#4/2.+8 | F#4/2.+8 |"
    horn2:   "| G4/2.+8 | A4/2.+8 | F4/2.+8 | G4/2.+8 | G4/2.+8 | A4/2.+8 | F#4/2.+8 | F#4/2.+8 |"
    bones:   "| [Eb3 G3]/2.+8 | [F3 A3]/2.+8 | [F3 Bb3]/2.+8 | [G3 Bb3]/2.+8 | [Eb3 G3]/2.+8 | [F3 A3]/2.+8 | [F#3 A3]/2.+8 | [F#3 C4]/2.+8 |"
    lo:      "| @lEb | @lF | @lBb | @lG | @lEb | @lF | @lD | @lD |"
    hi:      "| @hEb | @hF | @hF | @hD | @hEb | @hF | @hFs | @hFs |"
    timp:    "| @tEb | @tF | @tBb | @tG | @tEb | @tF | @tD | v=0.5 D3/16 D3 D3 D3 v=0.7 D3 D3 D3 D3 v=0.9 D3 D3 D3 D3 v=1 D3/8 |"
    snare:   "@snare8"
