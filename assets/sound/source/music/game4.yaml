type: song
title: Gefecht (in game 4)
description: >
  Skirmish in G minor in a restless 7/8 (2 + 2 + 3) at 180: the strings
  stab out the uneven ostinato with timpani and drums, the horns throw a
  hard theme in octaves (Gm, E-flat, Cm, D), and in B the trumpet breaks
  out into B-flat major (E-flat, F, B-flat, Gm, D). A2: trumpet and horns
  together with crashes. B ends on D, which pulls the loop back into
  G minor.
instruments: ../instruments.yaml
tempo: 180           # quarter = 20 ticks, eighth = 10: exact grid
meter: 7/8
budget: 32768

parts:
  trumpet: {instrument: trumpet, voices: [0], level: 0.9}
  horn1:   {instrument: horn, voices: [1], level: 1.2, pan: L}
  horn2:   {instrument: horn, voices: [2], octave: -1, level: 1.0, pan: R}
  bones:   {instrument: trombone, voices: [3, 4], level: 0.85}
  lo:      {instrument: spiccato, voices: [5], level: 0.95, pan: L}
  hi:      {instrument: spiccato, voices: [6], level: 0.7, pan: R}
  timp:    {instrument: timpani, voices: [7], level: 0.7}
  snare:   {voices: [8], level: 0.65, pan: R, kit: {s: {instrument: snare, note: C6}}}
  drums:   {voices: [9], level: 0.6, kit: {b: {instrument: bassdrum, note: D2}, c: {instrument: cymbal, note: C7}}}

patterns:
  # 7/8 ostinato, accents on the 2 + 2 + 3 groups
  lG:  "G2/8> G2 G2/8> G2 G2/8> D3 G2"
  lEb: "Eb3/8> Eb3 Eb3/8> Eb3 Eb3/8> Bb2 Eb3"
  lC:  "C3/8> C3 C3/8> C3 C3/8> G2 C3"
  lD:  "D3/8> D3 D3/8> D3 D3/8> A2 D3"
  lF:  "F2/8> F2 F2/8> F2 F2/8> C3 F2"
  lBb: "Bb2/8> Bb2 Bb2/8> Bb2 Bb2/8> F2 Bb2"
  hD:  "D4/8> D4 D4/8> D4 D4/8> D4 D4"
  hEb: "Eb4/8> Eb4 Eb4/8> Eb4 Eb4/8> Eb4 Eb4"
  hFs: "F#4/8> F#4 F#4/8> F#4 F#4/8> F#4 F#4"
  hF:  "F4/8> F4 F4/8> F4 F4/8> F4 F4"
  tG:  "G2/4 G2/4 D3/4."
  tEb: "Eb3/4 Eb3/4 Bb2/4."
  tC:  "C3/4 C3/4 G2/4."
  tD:  "D3/4 D3/4 A2/4."
  tF:  "F2/4 F2/4 C3/4."
  tBb: "Bb2/4 Bb2/4 F2/4."
  sBar: "r/4 s/4 r/8 v=0.6 s/8 v=1 s/8>"
  sFill: "v=0.5 s/16 s s s v=0.7 s s s s v=0.9 s s s s v=1 s/8>"
  snare8: "| @sBar | @sBar | @sBar | @sBar | @sBar | @sBar | @sBar | @sFill |"
  boom: "b/4 b/4 b/4."
  crash: "c/4 b/4 b/4."
  drums8: "| @crash | @boom | @boom | @boom | @crash | @boom | @boom | @boom |"

  theme: "| G4/4 Bb4/4 D5/4. | C5/4 Bb4/4 A4/4. | G4/4 Bb4/4 Eb5/4. | D5/4 C5/4 Bb4/4.
          | C5/4 Eb5/4 G5/4. | F5/4 Eb5/4 D5/4. | D5/4 C5/4 A4/4. | F#4/4 A4/4 D5/4. |"
  loA:   "| @lG | @lG | @lEb | @lEb | @lC | @lC | @lD | @lD |"
  hiA:   "| @hD | @hD | @hEb | @hEb | @hEb | @hEb | @hFs | @hFs |"
  bonesA: "| [D3 Bb3]/2.+8 | [D3 Bb3]/2.+8 | [Eb3 G3]/2.+8 | [Eb3 G3]/2.+8 | [Eb3 G3]/2.+8 | [Eb3 G3]/2.+8 | [F#3 A3]/2.+8 | [F#3 A3]/2.+8 |"
  timpA: "| @tG | @tG | @tEb | @tEb | @tC | @tC | @tD | @tD |"

