  A2:
    trumpet: "@theme"
    horn1:   "@theme"
    horn2:   "@theme"
    bones:   "@bonesA"
    lo:      "@loA"
    hi:      "@hiA"
    timp:    "@timpA"
    snare:   "@snare8"
    drums:   "| @crash | @boom | @crash | @boom | @crash | @boom | @crash | @boom |"

arrangement: [A, B, A2, B]
