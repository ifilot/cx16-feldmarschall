type: song
title: Kanonade (in game 2)
description: >
  Cannonade in C minor, in a relentless 5/4 (3 + 2) at 150: the strings and
  timpani hammer an unbroken ostinato like artillery fire while the trumpet,
  doubled an octave below by the horn, hurls a broad theme over trombone
  chords (Cm, A-flat, Fm, G). B climbs through A-flat, B-flat and C minor
  to G. A2: the theme again with crashes. Every section ends on G, which
  leads straight back into C minor.
instruments: ../instruments.yaml
tempo: 150           # quarter = 24 ticks, eighth = 12, sixteenth = 6: exact grid
meter: 5/4
budget: 32768

parts:
  trumpet: {instrument: trumpet, voices: [0], level: 0.95}
  horn:    {instrument: horn, voices: [1], octave: -1, level: 1.3, pan: L}
  bones:   {instrument: trombone, voices: [2, 3], level: 0.9, pan: R}
  lo:      {instrument: spiccato, voices: [4], level: 1.0, pan: L}
  hi:      {instrument: spiccato, voices: [5], level: 0.7, pan: R}
  timp:    {instrument: timpani, voices: [6], level: 0.75}
  snare:   {voices: [7], level: 0.65, pan: R, kit: {s: {instrument: snare, note: C6}}}
  drums:   {voices: [8], level: 0.65, kit: {b: {instrument: bassdrum, note: D2}, c: {instrument: cymbal, note: C7}}}

patterns:
  # 5/4 ostinato: eighth eighth quarter, eighth eighth quarter, quarter
  oC:  "C3/8> C3 C3/4 C3/8> C3 C3/4 G2/4>"
  oAb: "Ab2/8> Ab2 Ab2/4 Ab2/8> Ab2 Ab2/4 Eb2/4>"
  oF:  "F2/8> F2 F2/4 F2/8> F2 F2/4 C3/4>"
  oG:  "G2/8> G2 G2/4 G2/8> G2 G2/4 D3/4>"
  oBb: "Bb2/8> Bb2 Bb2/4 Bb2/8> Bb2 Bb2/4 F2/4>"
  pG:  "G3/8> G3 G3/4 G3/8> G3 G3/4 G3/4"
  pAb: "Ab3/8> Ab3 Ab3/4 Ab3/8> Ab3 Ab3/4 Ab3/4"
  pBb: "Bb3/8> Bb3 Bb3/4 Bb3/8> Bb3 Bb3/4 Bb3/4"
  pB:  "B3/8> B3 B3/4 B3/8> B3 B3/4 B3/4"
  tC:  "C3/4 r/4 C3/4 r/4 G2/4"
  tAb: "Ab2/4 r/4 Ab2/4 r/4 F2/4"
  tF:  "F2/4 r/4 F2/4 r/4 C3/4"
  tG:  "G2/4 r/4 G2/4 r/4 D3/4"
  tBb: "Bb2/4 r/4 Bb2/4 r/4 F2/4"
  sBar: "r/4 s/4 r/4 s/8 v=0.6 s/8 v=1 s/4"
  sFill: "v=0.5 s/16 s s s v=0.7 s s s s v=0.9 s s s s v=1 s/8 s/8 s/4>"
  snare8: "| @sBar | @sBar | @sBar | @sBar | @sBar | @sBar | @sBar | @sFill |"
  boom: "b/4 b/4 r/4 b/4 r/4"
  crash: "c/4 b/4 r/4 b/4 r/4"

  theme: "| C5/2. G4/2 | Eb5/2. D5/4 C5/4 | Ab4/2. C5/2 | Eb5/2. F5/4 Eb5/4
          | F5/2. C5/2 | Ab5/2. G5/4 F5/4 | G5/2. D5/2 | B4/2. D5/4 G4/4 |"
  bonesA: "| [Eb3 G3]/1+4 | [Eb3 G3]/1+4 | [Eb3 Ab3]/1+4 | [Eb3 Ab3]/1+4 | [F3 Ab3]/1+4 | [F3 Ab3]/1+4 | [D3 B3]/1+4 | [D3 B3]/1+4 |"
  loA:   "| @oC | @oC | @oAb | @oAb | @oF | @oF | @oG | @oG |"
  hiA:   "| @pG | @pG | @pAb | @pAb | @pAb | @pAb | @pG | @pB |"
  timpA: "| @tC | @tC | @tAb | @tAb | @tF | @tF | @tG | @tG |"

sections:
  intro:
    lo:    "| @oC | @oC |"
    timp:  "| @tC | v=0.5 G2/16 G2 G2 G2 v=0.7 G2 G2 G2 G2 v=0.9 G2 G2 G2 G2 G2 G2 G2 G2 v=1 G2/4 |"
    drums: "| @boom | @boom |"

  A:
    trumpet: "@theme"
    horn:    "@theme"
    bones:   "@bonesA"
    lo:      "@loA"
    hi:      "@hiA"
    timp:    "@timpA"
    snare:   "@snare8"
    drums:   "| @crash | @boom | @boom | @boom | @crash | @boom | @boom | @boom |"

  B:
    trumpet: "| Eb5/2. C5/2 | D5/2. F5/2 | G5/2. Eb5/2 | C5/1 r/4 | Ab5/2. Eb5/2 | Bb5/2. F5/2 | B5/2. G5/2 | D5/2. B4/4 G4/4 |"
    horn:    "| Eb5/2. C5/2 | D5/2. F5/2 | G5/2. Eb5/2 | C5/1 r/4 | Ab5/2. Eb5/2 | Bb5/2. F5/2 | B5/2. G5/2 | D5/2. B4/4 G4/4 |"
    bones:   "| [Eb3 Ab3]/1+4 | [F3 Bb3]/1+4 | [Eb3 G3]/1+4 | [Eb3 G3]/1+4 | [Eb3 Ab3]/1+4 | [F3 Bb3]/1+4 | [D3 B3]/1+4 | [D3 B3]/1+4 |"
    lo:      "| @oAb | @oBb | @oC | @oC | @oAb | @oBb | @oG | @oG |"
    hi:      "| @pAb | @pBb | @pG | @pG | @pAb | @pBb | @pB | @pB |"
    timp:    "| @tAb | @tBb | @tC | @tC | @tAb | @tBb | @tG | @tG |"
    snare:   "@snare8"
    drums:   "| @crash | @boom | @boom | @boom | @crash | @boom | @crash | @boom |"

  A2:
    trumpet: "@theme"
    horn:    "@theme"
    bones:   "@bonesA"
    lo:      "@loA"
    hi:      "@hiA"
    timp:    "@timpA"
    snare:   "@snare8"
    drums:   "| @crash | @boom | @crash | @boom | @crash | @boom | @crash | @boom |"

arrangement: [intro, A, B, A2]
loop: A
