  theme: "| E4/2. A4/4 | C5/2 A4/2 | G4/2. E4/4 | D4/2 B3/2 | C4/4 D4/4 E4/2 | F4/2 A4/2 | F4/4 E4/4 D4/2 | E4/1 |"
