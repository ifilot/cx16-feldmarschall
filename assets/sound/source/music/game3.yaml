type: song
title: Schlachtfeld (in game 3)
description: >
  Hold the line: a broad A-minor battle hymn, 4/4 at 112.5, over racing
  low strings in sixteenths. The horns sing a long heroic tune in octaves
  (Am, F, C, G, Am, F, Dm, E) over trombones, high held strings and
  pounding timpani and drums. A2: the trumpet soars above it. B: the
  trumpet leads through F, G, Em, Am to E, which drops back into A minor.
instruments: ../instruments.yaml
tempo: 112.5         # quarter = 32 ticks, eighth = 16, sixteenth = 8: exact grid
meter: 4/4
budget: 32768

parts:
  trumpet: {instrument: trumpet, voices: [0], level: 0.9}
  horn1:   {instrument: horn, voices: [1], level: 1.2, pan: L}
  horn2:   {instrument: horn, voices: [2], octave: -1, level: 1.0, pan: R}
  bones:   {instrument: trombone, voices: [3, 4], level: 0.8}
  lo:      {instrument: spiccato, voices: [5], level: 0.85}
  pad:     {instrument: strings, voices: [6, 7], level: 0.9, pan: R}
  timp:    {instrument: timpani, voices: [8], level: 0.7}
  snare:   {voices: [9], level: 0.6, pan: R, kit: {s: {instrument: snare, note: C6}}}
  drums:   {voices: [10], level: 0.6, kit: {b: {instrument: bassdrum, note: D2}, c: {instrument: cymbal, note: C7}}}

