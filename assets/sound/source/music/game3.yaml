  rF: "F2/16> F2 F2 F2 F2/16> F2 F2 F2 F2/16> F2 F2 F2 F2/16> F2 F2 F2"
  rC: "C3/16> C3 C3 C3 C3/16> C3 C3 C3 C3/16> C3 C3 C3 C3/16> C3 C3 C3"
  rG: "G2/16> G2 G2 G2 G2/16> G2 G2 G2 G2/16> G2 G2 G2 G2/16> G2 G2 G2"
  rD: "D3/16> D3 D3 D3 D3/16> D3 D3 D3 D3/16> D3 D3 D3 D3/16> D3 D3 D3"
  rE: "E2/16> E2 E2 E2 E2/16> E2 E2 E2 E2/16> E2 E2 E2 E2/16> E2 E2 E2"
  tA: "A2/4 r/8 A2/8 E3/4 r/4"
  tF: "F2/4 r/8 F2/8 C3/4 r/4"
  tC: "C3/4 r/8 C3/8 G2/4 r/4"
