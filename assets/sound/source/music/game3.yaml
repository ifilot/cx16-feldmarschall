    timp:    "| @tF | @tG | @tE | @tA | @tF | @tG | @tE | v=0.5 E3/16 E3 E3 E3 v=0.7 E3 E3 E3 E3 v=0.9 E3 E3 E3 E3 v=1 E3/4 |"
