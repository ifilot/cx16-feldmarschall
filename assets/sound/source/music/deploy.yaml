type: song
title: Kriegsrat (deployment)
description: >
  War council over the map table, for arranging the army (Manage setups and
  the pre-game deployment). E minor, steady and quietly expectant: a horn
  call answered by the oboe over soft strings, pizzicato bass and a muffled
  field drum. B turns to G major with the flute. A2 brings back the calls
  over a plucked arpeggio. Loops back to A.
instruments: ../instruments.yaml
tempo: 90            # quarter = 40 ticks, sixteenth = 10: exact grid
meter: 4/4
budget: 32768

parts:
  horn:    {instrument: horn, voices: [0], level: 1.18, pan: L}
  oboe:    {instrument: oboe, voices: [1], level: 1.18, pan: R,
            echo: {voice: 2, delay: "8", level: 0.25, pan: L}}
  flute:   {instrument: flute, voices: [3], level: 0.94}
  strings: {instrument: strings, voices: [4, 5, 6], level: 1.18}
  harp:    {instrument: harp, voices: [7, 8], ring: true, level: 0.94, pan: R}
  bass:    {instrument: pizz, voices: [9], level: 1.06}
  drum:    {voices: [10], level: 0.94, pan: L, kit: {d: {instrument: muffled, note: C5}}}

