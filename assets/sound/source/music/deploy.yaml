  drumEnd: "v=0.8 d/8 r/8 v=0.5 d/16 d/16 r/8 v=0.6 d/16 d/16 v=0.7 d/16 d/16 v=0.8 d/8 r/8"
  callsA: "| B4/8. B4/16 E5/4 G5/4. F#5/8 | E5/2 r/2 | r/1 | r/1
           | B4/8. B4/16 E5/4 G5/4. A5/8 | B5/2 r/2 | r/1 | r/1 |"
  answerA: "| r/1 | r/1 | r/4 C5/4 B4/8 A4/8 E5/4 | D#5/2. r/4
            | r/1 | r/1 | r/4 A4/4 C5/4 B4/8 A4/8 | G4/4 F#4/4 E4/2 |"
  padA: "| [E4 G4 B4]/1 | [E4 G4 C5]/1 | [E4 A4 C5]/1 | [D#4 F#4 B4]/1
         | [E4 G4 B4]/1 | [E4 G4 C5]/1 | [E4 A4 C5]/2 [D#4 F#4 B4]/2 | [E4 G4 B4]/1 |"
  bassA: "| E2/4 r/4 B2/4 r/4 | C3/4 r/4 G2/4 r/4 | A2/4 r/4 E2/4 r/4 | B2/4 r/4 F#2/4 r/4
          | E2/4 r/4 B2/4 r/4 | C3/4 r/4 G2/4 r/4 | A2/4 r/4 B2/4 r/4 | E2/4 r/4 B2/4 r/4 |"
  drumsA: "| @drumA | @drumA | @drumA | @drumA | @drumA | @drumA | @drumA | @drumEnd |"

  aEm: "E3/8 B3 E4 G4 B4 G4 E4 B3"
  aC:  "C3/8 G3 C4 E4 G4 E4 C4 G3"
  aAm: "A3/8 E4 A4 C5 E5 C5 A4 E4"
  aB7: "B3/8 D#4 F#4 A4 B4 A4 F#4 D#4"
  aAmB: "A3/8 E4 A4 C5 B3 D#4 F#4 A4"

