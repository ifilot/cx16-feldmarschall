    horn2:   "@theme"
    bones:   "@bonesA"
    hi:      "@hiA"
    lo:      "@loA"
    timp:    "@timpA"
    snare:   "@snare8"
    drums:   "| @crash | @boom | @crash | @boom | @crash | @boom | @crash | @boom |"

  B:
    trumpet: "| F5/4. F5/8 F5/4 G5/4 | E5/2. C5/4 | D5/4. E5/8 F5/4 A5/4 | A5/1
              | Bb5/4. A5/8 G5/4 F5/4 | G5/2. E5/4 | E5/4. F5/8 E5/4 C#5/4 | A4/2 r/2 |"
    horn1:   "| D5/1 | E5/1 | F5/1 | F5/1 | D5/1 | E5/1 | E5/1 | C#5/1 |"
    horn2:   "| D5/1 | E5/1 | F5/1 | F5/1 | D5/1 | E5/1 | E5/1 | C#5/1 |"
    bones:   "| [F3 Bb3]/1 | [G3 C4]/1 | [F3 A3]/1 | [F3 A3]/1 | [F3 Bb3]/1 | [G3 C4]/1 | [E3 A3]/1 | [E3 C#4]/1 |"
    hi:      "| @h_D | @h_E | @h_F | @h_F | @h_D | @h_E | @h_E | @h_Cs |"
    lo:      "| @l_Bb | @l_C | @l_D | @l_D | @l_Bb | @l_C | @l_A | @l_A |"
    pad:     "| [D5 F5]/1 | [E5 G5]/1 | [F5 A5]/1 | [F5 A5]/1 | [D5 F5]/1 | [E5 G5]/1 | [E5 A5]/1 | [C#5 E5]/1 |"
    timp:    "| @t_Bb | @t_C | @t_D | @t_D | @t_Bb | @t_C | @t_A | v=0.5 A2/16 A2 A2 A2 v=0.7 A2 A2 A2 A2 v=0.9 A2 A2 A2 A2 v=1 A2/4 |"
    snare:   "@snare8"
    drums:   "@drums8"

arrangement: [intro, A, A2, B]
loop: A
