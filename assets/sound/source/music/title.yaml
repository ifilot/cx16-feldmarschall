type: song
title: Feldmarschall (title / menu)
description: >
  Epic orchestral main theme in D minor, 4/4 at 150. Strings drive a
  relentless 3+3+2 ostinato in eighths (upper strings on a held pedal note,
  low strings on the roots) under a heroic horn theme in octaves,
  trombone chords, high sustained strings, pounding timpani, snare and bass
  drum. A: the theme on the horns (Dm, B-flat, Gm, A). A2: the trumpet
  takes it an octave higher with crashes. B: a rising fanfare
  (B-flat, C, Dm ... A) that throws the music back to A.
instruments: ../instruments.yaml
tempo: 150           # quarter = 24 ticks, eighth = 12, sixteenth = 6: exact grid
meter: 4/4
budget: 40960

parts:
  trumpet: {instrument: trumpet, voices: [0], level: 0.85}
  horn1:   {instrument: horn, voices: [1], level: 1.1, pan: L}
  horn2:   {instrument: horn, voices: [2], octave: -1, level: 0.94, pan: R}
  bones:   {instrument: trombone, voices: [3, 4], level: 0.77}
  hi:      {instrument: spiccato, voices: [5], level: 0.68, pan: R}
  lo:      {instrument: spiccato, voices: [6], level: 0.85, pan: L}
  pad:     {instrument: strings, voices: [7, 8], level: 0.94}
  timp:    {instrument: timpani, voices: [9], level: 0.68}
  snare:   {voices: [10], level: 0.68, pan: R, kit: {s: {instrument: snare, note: C6}}}
  drums:   {voices: [11], level: 0.59, kit: {b: {instrument: bassdrum, note: D2}, c: {instrument: cymbal, note: C7}}}

patterns:
  # string ostinato, 3+3+2 accents
  h_D:  "D4/8> D4 D4 D4/8> D4 D4 D4/8> D4"
  h_E:  "E4/8> E4 E4 E4/8> E4 E4 E4/8> E4"
  h_F:  "F4/8> F4 F4 F4/8> F4 F4 F4/8> F4"
  h_Cs: "C#4/8> C#4 C#4 C#4/8> C#4 C#4 C#4/8> C#4"
  l_D:  "D3/8> D3 D3 D3/8> D3 D3 D3/8> D3"
  l_Bb: "Bb2/8> Bb2 Bb2 Bb2/8> Bb2 Bb2 Bb2/8> Bb2"
  l_G:  "G2/8> G2 G2 G2/8> G2 G2 G2/8> G2"
  l_A:  "A2/8> A2 A2 A2/8> A2 A2 A2/8> A2"
  l_C:  "C3/8> C3 C3 C3/8> C3 C3 C3/8> C3"
  t_D:  "D3/4 r/8 D3/8 A2/4 r/4"
  t_Bb: "Bb2/4 r/8 Bb2/8 F2/4 r/4"
  t_G:  "G2/4 r/8 G2/8 D3/4 r/4"
  t_A:  "A2/4 r/8 A2/8 E3/4 r/4"
  t_C:  "C3/4 r/8 C3/8 G2/4 r/4"
  sBeat: "r/4 s/4 r/4 s/8 v=0.6 s/16 s/16 v=1"
  sFill: "v=0.5 s/16 s s s v=0.7 s s s s v=0.9 s s s s v=1 s/4>"
  snare8: "| @sBeat | @sBeat | @sBeat | @sBeat | @sBeat | @sBeat | @sBeat | @sFill |"
  boom:  "b/4 r/8 b/8 b/4 r/4"
  crash: "c/4 r/8 b/8 b/4 r/4"
  drums8: "| @crash | @boom | @boom | @boom | @crash | @boom | @boom | @boom |"

  theme:   "| D4/2. A3/4 | D4/4 E4/4 F4/2 | F4/2. D4/4 | Bb4/2 A4/2 | G4/2. A4/4 | Bb4/4 A4/4 G4/4 F4/4 | E4/1 | A3/2 C#4/2 |"
  themeHi: "| D5/2. A4/4 | D5/4 E5/4 F5/2 | F5/2. D5/4 | Bb5/2 A5/2 | G5/2. A5/4 | Bb5/4 A5/4 G5/4 F5/4 | E5/1 | A4/2 C#5/2 |"
  hiA:   "| @h_D | @h_D | @h_D | @h_D | @h_D | @h_D | @h_Cs | @h_Cs |"
  loA:   "| @l_D | @l_D | @l_Bb | @l_Bb | @l_G | @l_G | @l_A | @l_A |"
  bonesA: "| [F3 A3]/1 | [F3 A3]/1 | [F3 Bb3]/1 | [F3 Bb3]/1 | [G3 Bb3]/1 | [G3 Bb3]/1 | [E3 A3]/1 | [E3 C#4]/1 |"
  padA:  "| [D5 F5]/1 | [D5 F5]/1 | [D5 F5]/1 | [D5 F5]/1 | [D5 G5]/1 | [D5 G5]/1 | [C#5 E5]/1 | [C#5 E5]/1 |"
  timpA: "| @t_D | @t_D | @t_Bb | @t_Bb | @t_G | @t_G | @t_A | @t_A |"

sections:
