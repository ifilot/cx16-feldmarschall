    lo:    "| @l_D | @l_D |"
    bones: "| [D3 A3]/1 | [D3 A3]/2 [E3 A3]/2 |"
    timp:  "| v=0.3 D3/16 D3 D3 D3 D3 D3 D3 D3 v=0.45 D3 D3 D3 D3 D3 D3 D3 D3 | v=0.6 D3 D3 D3 D3 D3 D3 D3 D3 v=0.8 D3 D3 D3 D3 v=1 A2/4 |"
    snare: "| r/1 | @sFill |"
    drums: "| b/4 r/2. | b/4 r/4 b/4 b/4 |"

  A:
    horn1: "@theme"
    horn2: "@theme"
    bones: "@bonesA"
    hi:    "@hiA"
    lo:    "@loA"
    pad:   "v=0.55 @padA"
    timp:  "@timpA"
