# Feldmarschall sound assets (Commander X16 only).  Build:  bin/chipscore project assets/feldmarschall/project.yaml
#
# A Prussian field band of the Frederician / Napoleonic era for a game of
# hidden armies (Stratego rules), as epic orchestral battle music: string
# ostinatos, horns, trumpet, trombones, timpani, snare and bass drum; wooden tokens, steel and powder for the
# board effects.
name: feldmarschall

music:
  - {source: music/title.yaml, name: TITLE}     # splash + menu, about, options: "Feldmarschall" (epic D-minor main theme, string ostinato, 4/4)
  - {source: music/deploy.yaml, name: DEPLOY}   # Manage setups + pre-game deployment: "Kriegsrat" (E minor, expectant)
  - {source: music/game.yaml, name: GAME}       # in game 1 "Sturmangriff" (cavalry charge, galloping E-minor 6/8)
  - {source: music/game2.yaml, name: GAME2}     # in game 2 "Kanonade" (relentless C-minor 5/4 ostinato)
  - {source: music/game3.yaml, name: GAME3}     # in game 3 "Schlachtfeld" (A-minor battle hymn over racing strings)
  - {source: music/game4.yaml, name: GAME4}     # in game 4 "Gefecht" (G-minor skirmish in 7/8)
  - {source: music/victory.yaml, name: VICTORY} # one-shot: you capture the flag / Blue has no move (solemn, D minor to D major)
  - {source: music/defeat.yaml, name: DEFEAT}   # one-shot: Blue captures your flag / you have no move

# One sound per event. A battle plays ATTACK when both tokens turn face up
# (start_move), then one outcome when the losers fall (complete):
# BOMB, DEFUSE, SPY (spy takes the marshal), else BATTLE_WON / BATTLE_LOST
# from Red's point of view, or BATTLE_TIE. A flag capture plays VICTORY or
# DEFEAT instead of an outcome.
sfx:
  - {source: sfx/menu_move.yaml}
  - {source: sfx/menu_select.yaml}
  - {source: sfx/menu_back.yaml}
  - {source: sfx/pickup.yaml}           # token lifted (deploy and play)
  - {source: sfx/drop.yaml}             # token placed on a home row while deploying (also swaps)
  - {source: sfx/tray.yaml}             # token returned to the tray
  - {source: sfx/cancel.yaml}           # released elsewhere: goes back where it came from
  - {source: sfx/move.yaml, variants: [{suffix: ""}, {suffix: _CPU, transpose: -3}]}   # MOVE, MOVE_CPU (Blue's slide ends)
  - {source: sfx/scout.yaml}            # a quiet move of more than one square
  - {source: sfx/attack.yaml}
  - {source: sfx/battle_won.yaml}
  - {source: sfx/battle_lost.yaml}
  - {source: sfx/battle_tie.yaml}
  - {source: sfx/bomb.yaml}
  - {source: sfx/defuse.yaml}
  - {source: sfx/spy.yaml}
  - {source: sfx/random.yaml}           # RANDOM deployment
  - {source: sfx/load.yaml}             # LOAD takes a deployment
  - {source: sfx/save.yaml}             # SAVE stored
  - {source: sfx/type.yaml}             # a key in the SAVE name field
  - {source: sfx/error.yaml}            # refused: SAVE/START with pieces missing, illegal square
  - {source: sfx/start.yaml}            # START: the match begins
  - {source: sfx/dialog.yaml}           # a plate opens (load, save)

targets:
  psg:                     # Commander X16 / ZSMKit
    chip: psg
    output: ../../../build/sound/psg
    # music keeps to voices 0-11; effects own 12-15 (ZSMKit priority 1)
    reserve_sfx_voices: [12, 13, 14, 15]
    sfx_bank: SFX.BIN      # raw blob, load into RAM bank 2 at $A000
    address: 0xA000
    header: sfx.h
    # Bank 1 holds ZSMKit state, 2 holds SFX.BIN, and music starts at bank 3.
    # The game reserves 22/23 for play/AI code: MUSIC_LAST_BANK must stay <22.
    music_bank: 3
